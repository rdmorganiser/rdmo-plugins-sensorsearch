[[backends]]
name = "gfz"
type = "sms"
base_url = "https://sensors.gfz.de/backend/api/v1"
device_id_prefix = "gfzsms"
configuration_id_prefix = "gfzcfg"
[backends.settings]
static_location_end_tolerance_seconds = 120
incomplete_mount_chain_policy = "direct_device_offset"

[[backends]]
name = "kit"
type = "sms"
base_url = "https://sms.atmohub.kit.edu/backend/api/v1"
device_id_prefix = "kitsms"
configuration_id_prefix = "kitcfg"
[backends.settings]
static_location_end_tolerance_seconds = 120
incomplete_mount_chain_policy = "direct_device_offset"

[[backends]]
name = "ufz"
type = "sms"
base_url = "https://web.app.ufz.de/sms/backend/api/v1"
device_id_prefix = "ufzsms"
configuration_id_prefix = "ufzcfg"
[backends.settings]
static_location_end_tolerance_seconds = 120
incomplete_mount_chain_policy = "direct_device_offset"

[[backends]]
name = "o2a"
type = "o2a"
base_url = "https://registry.o2a-data.de"
device_id_prefix = "o2aregistry"
configuration_id_prefix = "o2amission"

[[backends]]
name = "gipp"
type = "gipp"
base_url = "https://gipp.gfz.de/instruments"
device_id_prefix = "gfzgipp"

[DeviceSearchProvider]
