[tox]
env_list = unit, django-old, django-new
toxworkdir = {env:SENSORSEARCH_TOX_WORK_DIR:.tox}

[testenv]
base_python = {env:SENSORSEARCH_TEST_PYTHON:python3}
package = editable
deps = pytest>=9,<10
commands = python -m pytest -q -c testing/pytest-unit.ini {posargs}

[testenv:django-old]
deps =
    pytest>=9,<10
    pytest-django>=4.11,<5
    rdmo==2.5.1
commands = python -m pytest -q -c testing/pytest-django.ini {posargs}

[testenv:django-new]
deps =
    pytest>=9,<10
    pytest-django>=4.11,<5
    rdmo @ git+https://github.com/rdmorganiser/rdmo.git@2da60cfe4c895aa3af20a0ca96fb74bd40059d05
commands = python -m pytest -q -c testing/pytest-django.ini {posargs}
